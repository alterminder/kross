[project]
name = "nlab"
version = "0.1.0"
description = "Negotiation simulator: rules engine and services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "openai>=1.54",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "authlib>=1.3",
    "joserfc>=0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "httpx>=0.27",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["nlab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "asyncpg.*"]
ignore_missing_imports = true
