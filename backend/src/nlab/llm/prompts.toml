converter_single_counterpart = '''
Create exactly one speaking counterpart: choose the primary person the trainee negotiates with.
Omit `multiparty` and `stakeholders` (stakeholders are also interactive actors in this simulator).
Keep other people and organizations as background in trainee_brief.situation, authority.must_consult and
constraints_from_constituency. Do not give them separate speaking roles or attribute their quoted dialogue
to the primary counterpart.
'''

converter_multiple_counterparts = '''
Several parties with their own opening statements -> one counterpart each (own challenges, own state_initial).
Use `multiparty` when the brief says the negotiations run in parallel. Include interactive `stakeholders` only
when supported by the brief. A brief with one speaking counterpart still gets one counterpart.
'''

